 2, Nunito, sans-serif\" fill=\"#2A2418\">{{m.nT}}<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsc-if>\n        <\u002Fg>\n      <\u002Fsc-for>\n    <\u002Fg>\n  <\u002Fsvg>\n\n  <div class=\"tools\">\n    <button class=\"{{layerCls}}\" sc-camel-on-click=\"{{toggleLayer}}\" aria-pressed=\"{{layerOn}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-cloud\"><\u002Fuse><\u002Fsvg>Cambio de lluvia (IDEAM)<\u002Fbutton>\n    <button class=\"chip\" sc-camel-on-click=\"{{openAyuda}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg>Ayuda<\u002Fbutton>\n    <sc-if value=\"{{hasNf}}\" hint-placeholder-val=\"{{false}}\">\n      <button class=\"chip warn\" sc-camel-on-click=\"{{clearF}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-filter\"><\u002Fuse><\u002Fsvg>{{nf}} filtro(s) · quitar<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <sc-if value=\"{{hasTip}}\" hint-placeholder-val=\"{{false}}\"><div class=\"tip\" role=\"status\">{{tip}}<\u002Fdiv><\u002Fsc-if>\n\n  <div class=\"zoomctl\" role=\"group\" aria-label=\"Controles del mapa\">\n    <button class=\"zb\" sc-camel-on-click=\"{{zIn}}\" aria-label=\"Acercar el mapa\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button class=\"zb\" sc-camel-on-click=\"{{zOut}}\" aria-label=\"Alejar el mapa\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-minus\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button class=\"zb\" sc-camel-on-click=\"{{zHome}}\" aria-label=\"Volver a ver toda Colombia\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-reset\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <sc-if value=\"{{canCenter}}\" hint-placeholder-val=\"{{false}}\">\n      <button class=\"zb\" sc-camel-on-click=\"{{zCenter}}\" aria-label=\"Centrar el mapa en la selección\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-compass\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{helpOn}}\" hint-placeholder-val=\"{{true}}\">\n    <div class=\"hint\" role=\"note\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span>Toca una región para explorarla. Arrastra, usa la rueda o pellizca para acercar. <button class=\"lnk\" sc-camel-on-click=\"{{closeHelp}}\">Entendido<\u002Fbutton><\u002Fspan><\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{layerOn}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"legend\" role=\"note\"><b>Lluvia proyectada ({{periodoLbl}})<\u002Fb><span><i style=\"background:hsl(32,85%,55%)\"><\u002Fi>Menos lluvia<\u002Fspan><span><i style=\"background:hsl(200,85%,55%)\"><\u002Fi>Más lluvia<\u002Fspan><span><i style=\"background:#DDD6C2\"><\u002Fi>Sin dato en la investigación<\u002Fspan><span>Proyección del IDEAM respecto a 1976-2005: no es una certeza.<\u002Fspan><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{noLayer}}\" hint-placeholder-val=\"{{true}}\">\n    <div class=\"legend\" role=\"note\"><b>¿Cómo leer el mapa?<\u002Fb><span><i style=\"background:#fff;border:2px solid #3B2A1A\"><\u002Fi>Zona departamental documentada<\u002Fspan><span><i style=\"background:#fff;border:2px dashed #3B2A1A\"><\u002Fi>Solo se menciona la región<\u002Fspan><span><i style=\"background:#FFC83D;border:2px solid #3B2A1A\"><\u002Fi>Grupo de cultivos: acércate<\u002Fspan><\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{hasTray}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"tray\"><button class=\"trayh\" sc-camel-on-click=\"{{trayToggle}}\" aria-expanded=\"{{trayOpen}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg><b>{{trayN}} cultivos sin zona documentada<\u002Fb><\u002Fbutton>\n      <sc-if value=\"{{trayOpen}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">Dato por investigar: no los ubicamos en el mapa para no inventar.<\u002Fp><\u002Fsc-if>\n      <sc-if value=\"{{trayOpen}}\" hint-placeholder-val=\"{{false}}\"><div class=\"row\">\n        <sc-for list=\"{{tray}}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{t.click}}\" aria-label=\"{{t.name}}, sin zona documentada\" style=\"opacity:{{t.op}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" width=\"34\" height=\"34\" aria-hidden=\"true\"><use href=\"{{t.ref}}\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{tBarOn}}\" hint-placeholder-val=\"{{false}}\">\n    <button class=\"tbar\" sc-camel-on-click=\"{{tBarGo}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-compass\"><\u002Fuse><\u002Fsvg>{{tMission}} · volver a la misión<\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<aside class=\"{{panelCls}}\" aria-label=\"Panel de información\">\n  <button class=\"grab\" sc-camel-on-click=\"{{toggleSheet}}\"><i><\u002Fi>{{grabTxt}}<\u002Fbutton>\n<sc-if value=\"{{isInicio}}\" hint-placeholder-val=\"{{true}}\">\n  <div class=\"pbody\">\n    <div class=\"hdr\" style=\"background:#FFD966\">\n      <svg class=\"big\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"#g-mango\"><\u002Fuse><\u002Fsvg>\n      <div><small>Bienvenida y bienvenido<\u002Fsmall><h2>Fruti Nuestro<\u002Fh2><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <p>Descubre dónde crecen frutas, verduras, raíces y cereales de Colombia, cómo viven y cómo un clima distinto puede cambiar el campo.<\u002Fp>\n      <div class=\"slab\"><span>Tu álbum<\u002Fspan><b>{{foundN}} de {{totalN}} cultivos<\u002Fb><\u002Fdiv>\n      <div class=\"prog\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{foundPct}}\" aria-label=\"Progreso del álbum\"><i style=\"width:{{foundPct}}%\"><\u002Fi><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"col\">\n      <button class=\"btn alt\" sc-camel-on-click=\"{{goTour}}\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-compass\"><\u002Fuse><\u002Fsvg>¡Explorar Colombia!<\u002Fbutton>\n      <div class=\"row\">\n        <button class=\"btn sm ghost\" sc-camel-on-click=\"{{goList}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-list\"><\u002Fuse><\u002Fsvg>Ver todos los cultivos<\u002Fbutton>\n        <button class=\"btn sm ghost\" sc-camel-on-click=\"{{goClima}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-cloud\"><\u002Fuse><\u002Fsvg>¿Qué pasa si cambia el clima?<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h3>Elige una región<\u002Fh3>\n    <div class=\"grid2\">\n      <sc-for list=\"{{regs}}\" as=\"r\" hint-placeholder-count=\"6\">\n        <button class=\"regc\" style=\"background:{{r.color}}\" sc-camel-on-click=\"{{r.click}}\" aria-label=\"Región {{r.name}}: {{r.nTxt}}\">\n          <b>{{r.name}}<\u002Fb><span>{{r.nTxt}}<\u002Fspan>\n          <sc-if value=\"{{r.visited}}\" hint-placeholder-val=\"{{false}}\"><svg class=\"ic s\" aria-label=\"Visitada\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"card soft\">\n      <p><b>Importante:<\u002Fb> los {{totalN}} cultivos del mapa son los que tienen ficha en la investigación; no son todos los cultivos de Colombia.<\u002Fp>\n      <button class=\"btn sm ghost\" sc-camel-on-click=\"{{openPend}}\">Ver {{pendN}} cultivos aún sin ficha<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <p class=\"quote\">«Un clima diferente puede cambiar dónde crecen nuestros alimentos. Conocerlo nos ayuda a cuidar el campo y tomar mejores decisiones».<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"foot\"><button sc-camel-on-click=\"{{openFuentes}}\">Fuentes<\u002Fbutton><button sc-camel-on-click=\"{{openAyuda}}\">Cómo usar el mapa<\u002Fbutton><sc-if value=\"{{noStore}}\" hint-placeholder-val=\"{{false}}\"><span>Tu progreso no se puede guardar en este navegador.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{isRegion}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"pbody\">\n    <button class=\"back\" sc-camel-on-click=\"{{rBack}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-left\"><\u002Fuse><\u002Fsvg>Toda Colombia<\u002Fbutton>\n    <div class=\"hdr\" style=\"background:{{rColor}}\">\n      <svg class=\"big\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{rGlyph}}\"><\u002Fuse><\u002Fsvg>\n      <div><small>Región<\u002Fsmall><h2>{{rName}}<\u002Fh2><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tabs\" role=\"tablist\">\n      <sc-for list=\"{{regTabs}}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button class=\"{{t.cls}}\" role=\"tab\" aria-selected=\"{{t.on}}\" sc-camel-on-click=\"{{t.click}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"{{t.ic}}\"><\u002Fuse><\u002Fsvg>{{t.name}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{deptOn}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\" style=\"border-color:#E5A800\">\n        <div class=\"row\"><h3>{{dName}}<\u002Fh3><button class=\"btn sm ghost\" sc-camel-on-click=\"{{dBack}}\">Ver toda la región<\u002Fbutton><\u002Fdiv>\n        <sc-if value=\"{{dHasCrops}}\" hint-placeholder-val=\"{{true}}\">\n          <p>Cultivos mencionados en este departamento:<\u002Fp>\n          <div class=\"grid3\">\n            <sc-for list=\"{{dCrops}}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.click}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{c.ref}}\"><\u002Fuse><\u002Fsvg>{{c.name}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{dNoCrops}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg>Dato por investigar: la investigación no menciona cultivos de los 28 con ficha en este departamento.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{dHasClima}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"fb neu\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-cloud\"><\u002Fuse><\u002Fsvg><span>IDEAM, 2071-2100 (frente a 1976-2005): <b>{{dClima.T}}<\u002Fb> de temperatura y <b>{{dClima.P}}<\u002Fb> de lluvia. Proyección de modelos, no certeza.<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isRes}}\" hint-placeholder-val=\"{{true}}\">\n      <div class=\"card\"><p>{{rIntro}}<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><h3>Clima<\u002Fh3><p>{{rClima}}<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><h3>Ecosistemas<\u002Fh3><p>{{rEcos}}<\u002Fp><\u002Fdiv>\n      <div class=\"card soft\"><h3>Estudio de caso<\u002Fh3><p>{{rCasos}}<\u002Fp><\u002Fdiv>\n      <div class=\"row\">\n        <button class=\"btn sm\" sc-camel-on-click=\"{{rList}}\">Ver sus cultivos en lista<\u002Fbutton>\n        <button class=\"btn sm ghost\" sc-camel-on-click=\"{{rSimClick}}\">¿Qué pasa si cambia el clima?<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{noRegCrops}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg><span>Aún no hay cultivos documentados en esta región: dato por investigar. <button class=\"lnk\" sc-camel-on-click=\"{{rPend}}\">Ver pendientes<\u002Fbutton><\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{hasRegCrops}}\" hint-placeholder-val=\"{{true}}\"><p class=\"small\">Descubiertos en esta región: <b>{{rFound}} de {{rTotal}}<\u002Fb>.<\u002Fp><\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isFr}}\" hint-placeholder-val=\"{{false}}\">\n      <sc-if value=\"{{hasFr}}\" hint-placeholder-val=\"{{true}}\">\n        <div class=\"grid3\">\n          <sc-for list=\"{{regFr}}\" as=\"c\" hint-placeholder-count=\"3\">\n            <button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.click}}\" aria-label=\"{{c.name}}, {{c.scale}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{c.ref}}\"><\u002Fuse><\u002Fsvg>{{c.name}}<small class=\"sc\">{{c.scale}}<\u002Fsmall><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{noFr}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg>Aún no hay frutas documentadas en esta región: dato por investigar.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isVe}}\" hint-placeholder-val=\"{{false}}\">\n      <sc-if value=\"{{hasVe}}\" hint-placeholder-val=\"{{true}}\">\n        <div class=\"grid3\">\n          <sc-for list=\"{{regVe}}\" as=\"c\" hint-placeholder-count=\"3\">\n            <button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.click}}\" aria-label=\"{{c.name}}, {{c.scale}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{c.ref}}\"><\u002Fuse><\u002Fsvg>{{c.name}}<small class=\"sc\">{{c.scale}}<\u002Fsmall><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{noVe}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg>Aún no hay verduras, raíces ni cereales documentados en esta región: dato por investigar.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isSe}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-calendar\"><\u002Fuse><\u002Fsvg>Calendario regional pendiente de verificar. Solo se muestra lo que la investigación documenta.<\u002Fdiv>\n      <sc-for list=\"{{regSeason}}\" as=\"s\" hint-placeholder-count=\"2\">\n        <div class=\"card\"><h3>{{s.name}}<\u002Fh3><p>{{s.txt}}<\u002Fp><\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{noSeason}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">Esta región no tiene datos de temporadas en la investigación.<\u002Fp><\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isCl}}\" hint-placeholder-val=\"{{false}}\">\n      <sc-for list=\"{{regClima}}\" as=\"c\" hint-placeholder-count=\"2\">\n        <div class=\"card\">\n          <div class=\"row\"><h3>{{c.name}}<\u002Fh3><span class=\"pill info\">IDEAM 2071-2100<\u002Fspan><\u002Fdiv>\n          <p>Temperatura <b>{{c.T}}<\u002Fb> · Lluvia <b>{{c.P}}<\u002Fb><\u002Fp>\n          <sc-if value=\"{{c.hasEf}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">{{c.ef}}<\u002Fp><\u002Fsc-if>\n          <button class=\"btn sm ghost\" sc-camel-on-click=\"{{c.click}}\">Probar en el simulador<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{hasMissing}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Sin proyección en la investigación para: {{missing}}. Dato por investigar.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{noRegClima}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">La investigación no trae proyecciones del IDEAM para los departamentos de esta región.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{isLista}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"pbody\">\n    <div class=\"row\"><h2>Cultivos<\u002Fh2><span class=\"pill info\">{{lHeadTxt}}<\u002Fspan><\u002Fdiv>\n    <div class=\"row\">\n      <sc-for list=\"{{chipsCat}}\" as=\"c\" hint-placeholder-count=\"4\">\n        <button class=\"{{c.cls}}\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{c.click}}\">{{c.name}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"row\">\n      <button class=\"btn sm ghost\" sc-camel-on-click=\"{{toggleF}}\" aria-expanded=\"{{showF}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-filter\"><\u002Fuse><\u002Fsvg>Filtros<\u002Fbutton>\n      <sc-if value=\"{{hasNf}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn sm ghost\" sc-camel-on-click=\"{{clearF}}\">Quitar {{nf}} filtro(s)<\u002Fbutton><\u002Fsc-if>\n      <button class=\"btn sm\" sc-camel-on-click=\"{{seeAll}}\">Ver todos los cultivos<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{showF}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\">\n        <label class=\"lb\" for=\"f-q\">Nombre común o científico<\u002Flabel>\n        <input id=\"f-q\" class=\"sel\" type=\"search\" value=\"{{fq}}\" sc-camel-on-input=\"{{setQ}}\" placeholder=\"Ej.: mango, Persea…\">\n        <div class=\"grid2\">\n          <div class=\"col\"><label class=\"lb\" for=\"f-reg\">Región<\u002Flabel><sc-raw-select id=\"f-reg\" value=\"{{freg}}\" sc-camel-on-change=\"{{setReg}}\"><sc-for list=\"{{oReg}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-dep\">Departamento<\u002Flabel><sc-raw-select id=\"f-dep\" value=\"{{fdep}}\" sc-camel-on-change=\"{{setDep}}\"><sc-for list=\"{{oDep}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-temp\">Temperatura que tolera<\u002Flabel><sc-raw-select id=\"f-temp\" value=\"{{ftemp}}\" sc-camel-on-change=\"{{setTemp}}\"><sc-for list=\"{{oTemp}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-alt\">Altitud<\u002Flabel><sc-raw-select id=\"f-alt\" value=\"{{falt}}\" sc-camel-on-change=\"{{setAlt}}\"><sc-for list=\"{{oAlt}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-agua\">Necesidad de agua<\u002Flabel><sc-raw-select id=\"f-agua\" value=\"{{fagua}}\" sc-camel-on-change=\"{{setAgua}}\"><sc-for list=\"{{oAgua}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-mes\">Mes de cosecha<\u002Flabel><sc-raw-select id=\"f-mes\" value=\"{{fmes}}\" sc-camel-on-change=\"{{setMes}}\"><sc-for list=\"{{oMes}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-orig\">Origen<\u002Flabel><sc-raw-select id=\"f-orig\" value=\"{{forig}}\" sc-camel-on-change=\"{{setOrig}}\"><sc-for list=\"{{oOrig}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-sens\">Sensibilidad al clima<\u002Flabel><sc-raw-select id=\"f-sens\" value=\"{{fsens}}\" sc-camel-on-change=\"{{setSens}}\"><sc-for list=\"{{oSens}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n          <div class=\"col\"><label class=\"lb\" for=\"f-dat\">Disponibilidad de datos<\u002Flabel><sc-raw-select id=\"f-dat\" value=\"{{fdat}}\" sc-camel-on-change=\"{{setDat}}\"><sc-for list=\"{{oDat}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n        <\u002Fdiv>\n        <label class=\"row\"><input type=\"checkbox\" checked=\"{{fded}}\" sc-camel-on-change=\"{{setDed}}\"><span>Incluir zonas <b>deducidas<\u002Fb> solo por altitud (no confirmadas)<\u002Fspan><\u002Flabel>\n        <sc-if value=\"{{mesNoData}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">El filtro por mes de cosecha está listo, pero la investigación aún no trae meses de cosecha por región: por eso no hay resultados (calendario pendiente de verificar).<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{hasRows}}\" hint-placeholder-val=\"{{true}}\">\n      <div class=\"grid3\">\n        <sc-for list=\"{{lRows}}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.click}}\" aria-label=\"{{c.name}}, {{c.sci}}. {{c.reg}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{c.ref}}\"><\u002Fuse><\u002Fsvg>{{c.name}}<small class=\"sc\">{{c.reg}}<\u002Fsmall><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{hasPend}}\" hint-placeholder-val=\"{{false}}\">\n      <h3>Aún sin ficha ({{nPend}})<\u002Fh3>\n      <p class=\"small\">Aparecen en el inventario de la investigación, pero todavía no tienen datos verificados.<\u002Fp>\n      <div class=\"row\">\n        <sc-for list=\"{{lPend}}\" as=\"p\" hint-placeholder-count=\"3\">\n          <button class=\"pillbtn\" sc-camel-on-click=\"{{p.click}}\">{{p.name}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card soft\" role=\"status\">\n        <h3>No encontramos cultivos con esos filtros<\u002Fh3>\n        <p>Prueba quitar un filtro o buscar otro nombre. Recuerda que solo mostramos los cultivos con datos en la investigación.<\u002Fp>\n        <button class=\"btn\" sc-camel-on-click=\"{{seeAll}}\">Ver todos los cultivos<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{isCrop}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"pbody\">\n    <div class=\"row\"><button class=\"back\" sc-camel-on-click=\"{{back}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-left\"><\u002Fuse><\u002Fsvg>{{backTxt}}<\u002Fbutton><div class=\"grow\"><\u002Fdiv>\n      <button class=\"btn sm ghost\" sc-camel-on-click=\"{{prevCrop}}\" aria-label=\"Cultivo anterior\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-left\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n      <button class=\"btn sm ghost\" sc-camel-on-click=\"{{nextCrop}}\" aria-label=\"Cultivo siguiente\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-right\"><\u002Fuse><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n    <div class=\"hdr\" style=\"background:#FFE9A8\">\n      <svg class=\"big\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{cRef}}\"><\u002Fuse><\u002Fsvg>\n      <div><small>{{cCat}}<\u002Fsmall><h2>{{cName}}<\u002Fh2><small><i>{{cSci}}<\u002Fi><\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tabs\" role=\"tablist\">\n      <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"6\">\n        <button class=\"{{t.cls}}\" role=\"tab\" aria-selected=\"{{t.on}}\" sc-camel-on-click=\"{{t.click}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"{{t.ic}}\"><\u002Fuse><\u002Fsvg>{{t.name}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{tId}}\" hint-placeholder-val=\"{{true}}\">\n      <div class=\"card\"><p>{{cDesc}}<\u002Fp>\n        <div class=\"grid2\"><div class=\"stat\"><b>{{cFam}}<\u002Fb><span>Familia botánica<\u002Fspan><\u002Fdiv><div class=\"stat\"><b>{{cOrigGrp}}<\u002Fb><span>Origen de la especie<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p><span class=\"{{cNativeCls}}\">{{cNative}}<\u002Fspan><\u002Fp><p class=\"small\">{{cOrig}}<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\"><div class=\"row\"><h3>¿Dónde se cultiva?<\u002Fh3><span class=\"{{confPlc.cls}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"{{confPlc.ic}}\"><\u002Fuse><\u002Fsvg>{{confPlc.txt}}<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{plc}}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div class=\"plc\"><div class=\"row\"><b>{{p.nm}}<\u002Fb><span class=\"pill info\">{{p.scale}}<\u002Fspan><span class=\"{{p.cls}}\">{{p.pillT}}<\u002Fspan><\u002Fdiv><p class=\"small\">{{p.nota}}<\u002Fp>\n            <div class=\"row\"><button class=\"btn sm ghost\" sc-camel-on-click=\"{{p.go}}\">Ver en el mapa<\u002Fbutton>\n              <sc-if value=\"{{p.hasSrc}}\" hint-placeholder-val=\"{{false}}\"><sc-for list=\"{{p.src}}\" as=\"s\" hint-placeholder-count=\"1\"><span class=\"small\">Fuente: {{s.n}}<\u002Fspan><\u002Fsc-for><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{hasDed}}\" hint-placeholder-val=\"{{false}}\">\n          <sc-for list=\"{{ded}}\" as=\"d\" hint-placeholder-count=\"1\"><div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-warn\"><\u002Fuse><\u002Fsvg><span><b>{{d.nm}} (deducida):<\u002Fb> {{d.nota}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fsc-if>\n        <sc-if value=\"{{noPlc}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg>Zona productora por investigar. La investigación no la documenta; por eso no lo ubicamos en el mapa.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{hasCh}}\" hint-placeholder-val=\"{{false}}\">\n        <button class=\"card chcard\" sc-camel-on-click=\"{{chBtn}}\"><b>Personaje: {{ch.nombre}}<\u002Fb><span>{{chRegion}}<\u002Fspan><span class=\"small\">Toca para conocerlo<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tCr}}\" hint-placeholder-val=\"{{false}}\">\n      <sc-if value=\"{{thermo.has}}\" hint-placeholder-val=\"{{true}}\">\n        <div class=\"card\"><div class=\"row\"><h3><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-thermo\"><\u002Fuse><\u002Fsvg> Temperatura<\u002Fh3><span class=\"{{thermo.conf.cls}}\">{{thermo.conf.txt}}<\u002Fspan><\u002Fdiv>\n          <div class=\"bar\" role=\"img\" aria-label=\"Temperatura: {{thermo.txt}}\"><i style=\"left:{{thermo.left}}%;width:{{thermo.width}}%;background:#FF9F1C\"><\u002Fi><sc-if value=\"{{thermo.hasOpt}}\" hint-placeholder-val=\"{{false}}\"><i style=\"left:{{thermo.opt}}%;width:3%;background:#C93A2E\"><\u002Fi><\u002Fsc-if><\u002Fdiv>\n          <div class=\"scale\"><span>0 °C<\u002Fspan><span>10<\u002Fspan><span>20<\u002Fspan><span>30<\u002Fspan><span>40 °C<\u002Fspan><\u002Fdiv>\n          <p>{{thermo.txt}}<\u002Fp>\n          <sc-if value=\"{{thermo.optNd}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">Temperatura ideal: dato por investigar.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{noThermo}}\" hint-placeholder-val=\"{{false}}\"><div class=\"card\"><h3>Temperatura<\u002Fh3><div class=\"nodata\">Dato por investigar: la investigación aún no trae la temperatura de esta planta.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n      <div class=\"card\"><div class=\"row\"><h3><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-mount\"><\u002Fuse><\u002Fsvg> Altitud<\u002Fh3><span class=\"{{alt.conf.cls}}\">{{alt.conf.txt}}<\u002Fspan><\u002Fdiv>\n        <div class=\"bar\" role=\"img\" aria-label=\"Altitud: {{alt.txt}}\"><i style=\"left:{{alt.left}}%;width:{{alt.width}}%;background:#6BBF59\"><\u002Fi><\u002Fdiv>\n        <div class=\"scale\"><span>0 m<\u002Fspan><span>1.000<\u002Fspan><span>2.000<\u002Fspan><span>3.000 m<\u002Fspan><\u002Fdiv><p>{{alt.txt}}<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><div class=\"row\"><h3><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-drop\"><\u002Fuse><\u002Fsvg> Agua<\u002Fh3><span class=\"{{water.conf.cls}}\">{{water.conf.txt}}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{water.has}}\" hint-placeholder-val=\"{{true}}\"><div class=\"row\"><sc-for list=\"{{water.drops}}\" as=\"d\" hint-placeholder-count=\"5\"><svg class=\"ic l\" aria-hidden=\"true\" style=\"opacity:{{d.op}}\"><use href=\"#i-drop\"><\u002Fuse><\u002Fsvg><\u002Fsc-for><\u002Fdiv><p>{{water.txt}}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{noWater}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Dato por investigar: necesidad de agua no documentada.<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n      <div class=\"card\"><div class=\"row\"><h3><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-sun\"><\u002Fuse><\u002Fsvg> Luz<\u002Fh3><span class=\"{{light.conf.cls}}\">{{light.conf.txt}}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{light.has}}\" hint-placeholder-val=\"{{true}}\"><p>{{light.txt}}<\u002Fp><\u002Fsc-if><sc-if value=\"{{noLight}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Dato por investigar: necesidades de luz no documentadas.<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n      <div class=\"card\"><div class=\"row\"><h3><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-leaf\"><\u002Fuse><\u002Fsvg> Suelo<\u002Fh3><span class=\"{{soil.conf.cls}}\">{{soil.conf.txt}}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{soil.has}}\" hint-placeholder-val=\"{{true}}\"><p>{{soil.txt}}<\u002Fp><\u002Fsc-if><sc-if value=\"{{noSoil}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Dato por investigar: tipo de suelo no documentado.<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n      <div class=\"card\"><div class=\"row\"><h3><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-calendar\"><\u002Fuse><\u002Fsvg> Ciclo de vida<\u002Fh3><span class=\"{{ciclo.conf.cls}}\">{{ciclo.conf.txt}}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{ciclo.has}}\" hint-placeholder-val=\"{{true}}\"><p>{{ciclo.txt}}<\u002Fp><sc-if value=\"{{ciclo.hasFirst}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">{{ciclo.first}}<\u002Fp><\u002Fsc-if><\u002Fsc-if>\n        <sc-if value=\"{{noCiclo}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Dato por investigar: ciclo no documentado.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{hasCare}}\" hint-placeholder-val=\"{{false}}\"><sc-for list=\"{{care}}\" as=\"x\" hint-placeholder-count=\"1\"><p class=\"small\">• {{x}}<\u002Fp><\u002Fsc-for><\u002Fsc-if><\u002Fdiv>\n      <div class=\"card\"><h3>Así crece (ilustración)<\u002Fh3>\n        <div class=\"growth\">\n          <sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div class=\"{{s.cls}}\">\n              <svg sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\">\n                <sc-if value=\"{{s.f0}}\" hint-placeholder-val=\"{{true}}\"><use href=\"#g-semilla\"><\u002Fuse><\u002Fsc-if>\n                <sc-if value=\"{{s.f1}}\" hint-placeholder-val=\"{{false}}\"><path d=\"M32 58V38\" stroke=\"#3FA34D\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M32 40C24 40 22 32 24 28C30 28 33 33 32 40Z\" fill=\"#6BBF59\" stroke=\"#3B2A1A\" stroke-width=\"2\"><\u002Fpath><\u002Fsc-if>\n                <sc-if value=\"{{s.f2}}\" hint-placeholder-val=\"{{false}}\"><path d=\"M32 58V24\" stroke=\"#3FA34D\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M32 44C22 44 18 36 20 30C28 30 33 36 32 44Z M32 34C42 34 46 26 44 20C36 20 31 26 32 34Z\" fill=\"#6BBF59\" stroke=\"#3B2A1A\" stroke-width=\"2\"><\u002Fpath><\u002Fsc-if>\n                <sc-if value=\"{{s.f3}}\" hint-placeholder-val=\"{{false}}\"><path d=\"M32 58V24\" stroke=\"#3FA34D\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M32 46C22 46 18 38 20 32C28 32 33 38 32 46Z\" fill=\"#6BBF59\" stroke=\"#3B2A1A\" stroke-width=\"2\"><\u002Fpath><circle cx=\"32\" cy=\"18\" r=\"6\" fill=\"#FFB6C1\" stroke=\"#3B2A1A\" stroke-width=\"2\"><\u002Fcircle><circle cx=\"32\" cy=\"18\" r=\"2.5\" fill=\"#FFC83D\"><\u002Fcircle><\u002Fsc-if>\n                <sc-if value=\"{{s.f4}}\" hint-placeholder-val=\"{{false}}\"><use href=\"{{s.ref}}\"><\u002Fuse><\u002Fsc-if>\n              <\u002Fsvg>{{s.n}}\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button class=\"btn sm\" sc-camel-on-click=\"{{doPlay}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>Ver cómo crece<\u002Fbutton>\n        <p class=\"small\">Ilustración sencilla de las etapas; no muestra los tiempos reales de este cultivo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tCa}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\"><h3>Calendario de enero a diciembre<\u002Fh3>\n        <div class=\"nodata\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-calendar\"><\u002Fuse><\u002Fsvg>Calendario regional pendiente de verificar: la investigación no trae meses de siembra ni de cosecha.<\u002Fdiv>\n        <div class=\"cal\" role=\"img\" aria-label=\"Calendario de periodos secos y lluviosos\">\n          <sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><span class=\"{{m.cls}}\" title=\"{{m.t}}\">{{m.m}}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{calClima}}\" hint-placeholder-val=\"{{false}}\"><div class=\"row\"><span class=\"pill nd\" style=\"background:#FFD98A\">Seco<\u002Fspan><span class=\"pill info\">Lluvioso<\u002Fspan><\u002Fdiv><p class=\"small\">Clima de referencia: {{calRef}}. Es solo un ejemplo de un lugar, no el calendario de siembra y cosecha.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{noCalClima}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">Dato por investigar: ni siquiera hay un clima de referencia para este cultivo.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{hasCalNota}}\" hint-placeholder-val=\"{{false}}\"><p>{{calNota}}<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tPr}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\"><h3>¿Cuánto cuesta?<\u002Fh3>\n        <sc-if value=\"{{hasPrices}}\" hint-placeholder-val=\"{{true}}\">\n          <sc-for list=\"{{prices}}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div class=\"plc\"><div class=\"row\"><b>{{p.prod}}<\u002Fb><span class=\"pill info\">{{p.tipo}}<\u002Fspan><\u002Fdiv><p class=\"small\">{{p.ciudad}} · {{p.fecha}}<\u002Fp>\n              <sc-if value=\"{{p.hasVal}}\" hint-placeholder-val=\"{{true}}\"><p class=\"price\">{{p.val}}<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{p.hasMen}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">{{p.menTxt}}<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{p.hasAnu}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">{{p.anuTxt}}<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{p.hasNota}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">{{p.nota}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n        <sc-if value=\"{{noPrices}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Dato por investigar: la investigación no trae precios de este cultivo.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{prodrOkNo}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">No hay precio al productor en la investigación: no se compara con el mayorista ni con el de la tienda.<\u002Fdiv><\u002Fsc-if>\n        <div class=\"card soft\"><b>¿Por qué cambian los precios?<\u002Fb><p class=\"small\">El precio al productor (lo que recibe quien cultiva), el mayorista (en las centrales) y el de la tienda no son iguales. Cambia con la oferta, el clima y el transporte. Un precio de un mes no basta para decidir.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{hasProd}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"card\"><h3>Producción en Colombia<\u002Fh3>\n          <sc-for list=\"{{prodRows}}\" as=\"r\" hint-placeholder-count=\"2\"><div class=\"grid3\"><div class=\"stat\"><b>{{r.area}}<\u002Fb><span>Área · {{r.lbl}}<\u002Fspan><\u002Fdiv><div class=\"stat\"><b>{{r.prod}}<\u002Fb><span>Producción<\u002Fspan><\u002Fdiv><div class=\"stat\"><b>{{r.rend}}<\u002Fb><span>Rendimiento<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <sc-if value=\"{{hasProdNota}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">{{prodNota}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{hasExpo}}\" hint-placeholder-val=\"{{false}}\"><div class=\"card\"><h3>Exportaciones 2024<\u002Fh3><div class=\"grid2\"><div class=\"stat\"><b>{{expo.usd}}<\u002Fb><span>Valor<\u002Fspan><\u002Fdiv><div class=\"stat\"><b>{{expo.t}}<\u002Fb><span>Volumen<\u002Fspan><\u002Fdiv><\u002Fdiv><p class=\"small\">{{expo.v}}<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{strHas}}\" hint-placeholder-val=\"{{false}}\"><div class=\"card\"><h3>Margen del aguacate en escenarios (modelo FINAGRO)<\u002Fh3>\n        <sc-for list=\"{{cStress}}\" as=\"x\" hint-placeholder-count=\"4\"><div><div class=\"slab\"><span>{{x.n}}<\u002Fspan><b>{{x.t}}<\u002Fb><\u002Fdiv><div class=\"prog\"><i style=\"width:{{x.w}}%;background:{{x.col}}\"><\u002Fi><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n        <p class=\"small\">Es un ejercicio ilustrativo de un modelo, no una predicción.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tHi}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\"><h3>Curiosidades<\u002Fh3><ul><sc-for list=\"{{cur}}\" as=\"x\" hint-placeholder-count=\"2\"><li>{{x}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n      <div class=\"card\"><h3>¿Cuándo llegó a Colombia?<\u002Fh3><div class=\"nodata\">{{llegada}}<\u002Fdiv><h3>Usos tradicionales<\u002Fh3><div class=\"nodata\">{{usos}}<\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{hasSens}}\" hint-placeholder-val=\"{{false}}\"><div class=\"card\"><h3>Clima y este cultivo<\u002Fh3><p>{{sens}}<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <div class=\"card\"><h3>Mini quiz<\u002Fh3>\n        <sc-for list=\"{{quiz}}\" as=\"q\" hint-placeholder-count=\"2\">\n          <div class=\"col\"><p><b>{{q.q}}<\u002Fb><\u002Fp>\n            <sc-for list=\"{{q.opts}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" disabled=\"{{o.dis}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for>\n            <sc-if value=\"{{q.done}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fb neu\" role=\"status\"><span><b>{{q.msg}}<\u002Fb> {{q.why}}<\u002Fspan><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tCo}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\"><h3>Nivel de confianza<\u002Fh3><p>Evidencia general en la investigación: <b>{{cEv}}<\u002Fb>.<\u002Fp>\n        <sc-for list=\"{{confRows}}\" as=\"r\" hint-placeholder-count=\"4\"><div class=\"crow\"><span>{{r.n}}<\u002Fspan><span class=\"{{r.pill.cls}}\">{{r.pill.txt}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"card\"><h3>Fuentes<\u002Fh3>\n        <sc-for list=\"{{srcs}}\" as=\"s\" hint-placeholder-count=\"2\"><p class=\"small\"><b>{{s.n}}<\u002Fb> · {{s.t}} <sc-if value=\"{{s.hasUrl}}\" hint-placeholder-val=\"{{false}}\"><a class=\"src\" href=\"{{s.url}}\" target=\"_blank\" rel=\"noopener noreferrer\">Abrir enlace<\u002Fa><\u002Fsc-if><\u002Fp><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"card soft\"><h3>Pendiente por verificar<\u002Fh3><ul><sc-for list=\"{{cPend}}\" as=\"x\" hint-placeholder-count=\"2\"><li>{{x}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{isClima}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"pbody\">\n    <button class=\"back\" sc-camel-on-click=\"{{climaBack}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-left\"><\u002Fuse><\u002Fsvg>Volver al mapa<\u002Fbutton>\n    <div class=\"hdr\" style=\"background:#BFE6F7\"><svg class=\"big\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"#g-borojo\"><\u002Fuse><\u002Fsvg><div><small>Simulador educativo<\u002Fsmall><h2>¿Qué pasa si cambia el clima?<\u002Fh2><\u002Fdiv><\u002Fdiv>\n    <div class=\"fb neu\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span><b>Esto es una simulación, no una predicción.<\u002Fb> Compara los rangos que la investigación documenta con cambios imaginarios. No dice que un cultivo vaya a prosperar ni a desaparecer.<\u002Fspan><\u002Fdiv>\n\n    <div class=\"card\"><h3>1. Elige un lugar de partida<\u002Fh3>\n      <div class=\"col\"><sc-for list=\"{{sites}}\" as=\"s\" hint-placeholder-count=\"4\"><button class=\"{{s.cls}}\" aria-pressed=\"{{s.on}}\" sc-camel-on-click=\"{{s.click}}\">{{s.n}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <p class=\"small\">{{siteDesc}}<\u002Fp>\n      <sc-if value=\"{{isOwn}}\" hint-placeholder-val=\"{{false}}\"><div class=\"col\">\n        <div class=\"slab\"><label for=\"s-tb\">Temperatura de partida<\u002Flabel><b>{{tBase}} °C<\u002Fb><\u002Fdiv><input id=\"s-tb\" type=\"range\" min=\"8\" max=\"34\" step=\"1\" value=\"{{tBase}}\" sc-camel-on-input=\"{{setTBase}}\">\n        <div class=\"slab\"><label for=\"s-pb\">Lluvia de partida<\u002Flabel><b>{{pBase}} mm/año<\u002Fb><\u002Fdiv><input id=\"s-pb\" type=\"range\" min=\"500\" max=\"8000\" step=\"100\" value=\"{{pBase}}\" sc-camel-on-input=\"{{setPBase}}\"><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div class=\"card\"><h3>2. Cambia el clima<\u002Fh3>\n      <div class=\"slab\"><label for=\"s-dt\">Temperatura<\u002Flabel><b>{{dTt}}<\u002Fb><\u002Fdiv><input id=\"s-dt\" type=\"range\" min=\"0\" max=\"4\" step=\"0.5\" value=\"{{dT}}\" sc-camel-on-input=\"{{setDT}}\">\n      <div class=\"slab\"><label for=\"s-dp\">Menos agua<\u002Flabel><b>{{dPt}}<\u002Fb><\u002Fdiv><input id=\"s-dp\" type=\"range\" min=\"0\" max=\"40\" step=\"5\" value=\"{{dP}}\" sc-camel-on-input=\"{{setDP}}\">\n      <div class=\"slab\"><label for=\"s-sq\">Sequías más largas<\u002Flabel><b>{{sequiaT}}<\u002Fb><\u002Fdiv><input id=\"s-sq\" type=\"range\" min=\"0\" max=\"3\" step=\"1\" value=\"{{sequia}}\" sc-camel-on-input=\"{{setSeq}}\">\n      <div class=\"slab\"><label for=\"s-ll\">Lluvias intensas<\u002Flabel><b>{{lluviaT}}<\u002Fb><\u002Fdiv><input id=\"s-ll\" type=\"range\" min=\"0\" max=\"3\" step=\"1\" value=\"{{lluvia}}\" sc-camel-on-input=\"{{setLluv}}\">\n      <div class=\"slab\"><label for=\"s-di\">Distribución de la lluvia<\u002Flabel><b>{{distT}}<\u002Fb><\u002Fdiv><input id=\"s-di\" type=\"range\" min=\"0\" max=\"2\" step=\"1\" value=\"{{dist}}\" sc-camel-on-input=\"{{setDist}}\">\n      <button class=\"btn sm ghost\" sc-camel-on-click=\"{{simReset}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-reset\"><\u002Fuse><\u002Fsvg>Volver al clima de partida<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"card\"><h3>El paisaje<\u002Fh3>\n      <svg sc-camel-view-box=\"0 0 200 110\" class=\"land\" role=\"img\" aria-label=\"Paisaje que cambia con el clima: sol, nubes, suelo, río y planta\">\n        <rect width=\"200\" height=\"55\" fill=\"{{skyA}}\"><\u002Frect><rect y=\"55\" width=\"200\" height=\"15\" fill=\"{{skyB}}\"><\u002Frect>\n        <circle cx=\"168\" cy=\"24\" r=\"{{sunR}}\" fill=\"{{sunFill}}\" stroke=\"{{sunRay}}\" stroke-width=\"3\"><\u002Fcircle>\n        <g opacity=\"{{cloudOp}}\"><ellipse cx=\"60\" cy=\"22\" rx=\"26\" ry=\"10\" fill=\"#fff\" stroke=\"#9BB7C9\" stroke-width=\"1.5\"><\u002Fellipse><ellipse cx=\"78\" cy=\"26\" rx=\"20\" ry=\"8\" fill=\"#fff\" stroke=\"#9BB7C9\" stroke-width=\"1.5\"><\u002Fellipse><ellipse cx=\"46\" cy=\"27\" rx=\"16\" ry=\"7\" fill=\"#fff\" stroke=\"#9BB7C9\" stroke-width=\"1.5\"><\u002Fellipse><\u002Fg>\n        <sc-for list=\"{{drops}}\" as=\"d\" hint-placeholder-count=\"8\"><sc-if value=\"{{d.on}}\" hint-placeholder-val=\"{{true}}\"><path d=\"M{{d.x}} {{d.y}} l-2 7\" stroke=\"#2F86C1\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"{{dropOp}}\"><\u002Fpath><\u002Fsc-if><\u002Fsc-for>\n        <rect y=\"70\" width=\"200\" height=\"40\" fill=\"{{groundCol}}\"><\u002Frect>\n        <g opacity=\"{{crackOp}}\" stroke=\"#6B4A1E\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M10 80 l10 6 l-4 8\"><\u002Fpath><path d=\"M60 90 l12 -5 l6 8\"><\u002Fpath><path d=\"M120 84 l9 7 l-3 9\"><\u002Fpath><path d=\"M165 92 l10 -4\"><\u002Fpath><\u002Fg>\n        <path d=\"M0 98 Q50 90 100 98 T200 96\" fill=\"none\" stroke=\"#3FA3DE\" stroke-width=\"{{riverH}}\" stroke-linecap=\"round\" opacity=\".9\"><\u002Fpath>\n        <sc-if value=\"{{floodOn}}\" hint-placeholder-val=\"{{false}}\"><rect y=\"88\" width=\"200\" height=\"22\" fill=\"#3FA3DE\" opacity=\".45\"><\u002Frect><\u002Fsc-if>\n        <g transform=\"{{plantTr}}\"><path d=\"M100 88 V60\" stroke=\"{{plantCol}}\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M100 72 C88 72 84 64 86 58 C94 58 101 64 100 72Z M100 66 C112 66 116 58 114 52 C106 52 99 58 100 66Z\" fill=\"{{plantCol}}\" stroke=\"#3B2A1A\" stroke-width=\"1.5\"><\u002Fpath><\u002Fg>\n      <\u002Fsvg>\n      <p class=\"small\">Del tamaño del sol al color del suelo, el dibujo solo ilustra la intensidad de los cambios que elijas.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"card\"><h3>Con tu cambio<\u002Fh3>\n      <div class=\"grid2\"><div class=\"stat\"><b>{{simT0}} → {{simT1}} °C<\u002Fb><span>Temperatura<\u002Fspan><\u002Fdiv><div class=\"stat\"><b>{{simP0}} → {{simP1}} mm<\u002Fb><span>Lluvia al año<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"fb neu\" role=\"status\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span>{{simAlert}}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{hasSimRows}}\" hint-placeholder-val=\"{{true}}\">\n        <p class=\"small\">Cultivos documentados cuyo rango de temperatura incluye la de partida ({{simListed}}). No son todos los cultivos posibles ni dónde convendría sembrar.<\u002Fp>\n        <sc-for list=\"{{simRows}}\" as=\"r\" hint-placeholder-count=\"3\"><div class=\"{{r.cls}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" width=\"40\" height=\"40\" aria-hidden=\"true\"><use href=\"{{r.ref}}\"><\u002Fuse><\u002Fsvg><span><b>{{r.name}}<\u002Fb> · {{r.rng}}<br>{{r.lbl}}. {{r.why}} <button class=\"lnk\" sc-camel-on-click=\"{{r.click}}\">Ver ficha<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fsc-if>\n      <sc-if value=\"{{noSimRows}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Ningún cultivo documentado tiene un rango de temperatura que incluya {{simT0}} °C. Eso no significa que no crezca nada: solo que la investigación no lo documenta (dato por investigar).<\u002Fdiv><\u002Fsc-if>\n      <p class=\"small\">{{simNoT}} cultivos no tienen temperatura documentada y no se evalúan.<\u002Fp>\n      <sc-if value=\"{{hasExtra}}\" hint-placeholder-val=\"{{false}}\"><sc-for list=\"{{simExtra}}\" as=\"e\" hint-placeholder-count=\"2\"><div class=\"card soft\"><b>{{e.t}}<\u002Fb><p class=\"small\">{{e.x}}<\u002Fp><\u002Fdiv><\u002Fsc-for><\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div class=\"card\"><h3>Proyecciones del IDEAM<\u002Fh3>\n      <p class=\"small\">{{idNota}}<\u002Fp>\n      <label class=\"lb\" for=\"id-d\">Departamento<\u002Flabel><sc-raw-select id=\"id-d\" value=\"{{idDpto}}\" sc-camel-on-change=\"{{setIdDpto}}\"><sc-for list=\"{{idDepts}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n      <label class=\"lb\" for=\"id-p\">Periodo<\u002Flabel><sc-raw-select id=\"id-p\" value=\"{{idPer}}\" sc-camel-on-change=\"{{setIdPer}}\"><sc-for list=\"{{idPers}}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{o.v}}\">{{o.t}}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n      <sc-if value=\"{{hasIdeam}}\" hint-placeholder-val=\"{{true}}\"><div class=\"grid2\"><div class=\"stat\"><b>{{ideam.T}}<\u002Fb><span>Temperatura<\u002Fspan><\u002Fdiv><div class=\"stat\"><b>{{ideam.P}}<\u002Fb><span>Lluvia<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <sc-if value=\"{{ideam.hasEf}}\" hint-placeholder-val=\"{{false}}\"><p class=\"small\">{{ideam.ef}}<\u002Fp><\u002Fsc-if><\u002Fsc-if>\n      <sc-if value=\"{{noIdeam}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Sin proyección en la investigación para este departamento: dato por investigar.<\u002Fdiv><\u002Fsc-if>\n      <p class=\"small\">{{idNacional}}<\u002Fp>\n      <div class=\"card soft\"><b>El Niño<\u002Fb><p class=\"small\">{{elnino}}<\u002Fp><\u002Fdiv>\n      <button class=\"btn sm ghost\" sc-camel-on-click=\"{{idMap}}\">{{idMapTxt}}<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"card\"><p class=\"quote\">«Un clima diferente puede cambiar dónde crecen nuestros alimentos. Conocerlo nos ayuda a cuidar el campo y tomar mejores decisiones».<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{isTour}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"pbody\">\n    <div class=\"hdr\" style=\"background:#FFB65C\"><svg class=\"big\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"#g-mango\"><\u002Fuse><\u002Fsvg><div><small>Aventura guiada<\u002Fsmall><h2>¡Explorar Colombia!<\u002Fh2><\u002Fdiv><\u002Fdiv>\n    <div class=\"tdots\" role=\"img\" aria-label=\"Misión {{tStep}} de {{tN}}\"><sc-for list=\"{{tDots}}\" as=\"d\" hint-placeholder-count=\"6\"><span class=\"{{d.cls}}\">{{d.n}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n\n    <sc-if value=\"{{tGeneral}}\" hint-placeholder-val=\"{{true}}\">\n      <div class=\"card\"><h3>Misión {{tStep}}: {{tTitle}}<\u002Fh3><p>{{tTxt}}<\u002Fp>\n        <sc-if value=\"{{tHasCrops}}\" hint-placeholder-val=\"{{true}}\"><div class=\"grid3\"><sc-for list=\"{{tCrops}}\" as=\"c\" hint-placeholder-count=\"3\"><button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.click}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{c.ref}}\"><\u002Fuse><\u002Fsvg>{{c.name}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{tNoCrops}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">Esta región aún no tiene cultivos documentados en la investigación.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{tQuiz}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\"><h3>Misión {{tStep}}: {{tTitle}}<\u002Fh3><p>{{tTxt}}<\u002Fp><p class=\"big-q\">¿Qué proyecta el IDEAM para Arauca hacia 2071-2100?<\u002Fp>\n        <sc-for list=\"{{tOpts}}\" as=\"o\" hint-placeholder-count=\"4\"><button class=\"{{o.cls}}\" disabled=\"{{o.dis}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for>\n        <sc-if value=\"{{tQAns}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fb neu\" role=\"status\"><span>{{tQWhy}}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{tQWrong}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn sm\" sc-camel-on-click=\"{{tRetry}}\">Intentar otra vez<\u002Fbutton><\u002Fsc-if><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{tInfo}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\"><h3>Misión {{tStep}}: {{tTitle}}<\u002Fh3><p>{{tTxt}}<\u002Fp><div class=\"nodata\">{{tInsNote}}<\u002Fdiv><button class=\"btn\" sc-camel-on-click=\"{{tDoneInfo}}\">Entendido<\u002Fbutton><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{tDone}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"card\" style=\"border-color:#E5A800\"><h3>¡Completaste la aventura!<\u002Fh3><p>Recorriste las seis regiones. Ganaste estrellas y un paso hacia la insignia Embajador de la biodiversidad (para obtenerla también debes descubrir los {{pTot}} cultivos).<\u002Fp><p><b>Llevas {{tStars}} estrellas.<\u002Fb><\u002Fp>\n        <div class=\"row\"><button class=\"btn\" sc-camel-on-click=\"{{tAlbum}}\">Ver mi álbum<\u002Fbutton><button class=\"btn ghost\" sc-camel-on-click=\"{{tFinish}}\">Volver al mapa<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{tNotDone}}\" hint-placeholder-val=\"{{true}}\"><div class=\"row\"><button class=\"btn sm ghost\" sc-camel-on-click=\"{{tRegionGo}}\">Ir a la región<\u002Fbutton><button class=\"btn sm ghost\" sc-camel-on-click=\"{{tSkip}}\">Saltar misión<\u002Fbutton><button class=\"btn sm ghost\" sc-camel-on-click=\"{{tStop}}\">Salir de la aventura<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Faside>\n<\u002Fdiv>\n<nav class=\"bottombar\" aria-label=\"Navegación inferior\">\n  <sc-for list=\"{{nav}}\" as=\"n\" hint-placeholder-count=\"5\">\n    <button class=\"{{n.bcls}}\" sc-camel-on-click=\"{{n.click}}\" aria-current=\"{{n.cur}}\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"{{n.ic}}\"><\u002Fuse><\u002Fsvg><span>{{n.n}}<\u002Fspan><\u002Fbutton>\n  <\u002Fsc-for>\n  <button class=\"bb hide-d\" sc-camel-on-click=\"{{startTour}}\" style=\"background:#FFC83D;color:#3B2A00;border-color:#3B2A00\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"#i-compass\"><\u002Fuse><\u002Fsvg><span>Explorar<\u002Fspan><\u002Fbutton>\n<\u002Fnav>\n\n<sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"toast\" role=\"status\" aria-live=\"polite\">\n    <sc-if value=\"{{toastHasCrop}}\" hint-placeholder-val=\"{{false}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{toastCrop}}\"><\u002Fuse><\u002Fsvg><\u002Fsc-if>\n    <span>{{toastT}}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{anyModal}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"mbg\" sc-camel-on-click=\"{{closeBg}}\">\n  <div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"{{modalTitle}}\" sc-camel-on-click=\"{{stopProp}}\" sc-camel-on-key-down=\"{{modalKey}}\">\n\n    <sc-if value=\"{{mGame}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"mh\"><sc-if value=\"{{inGame}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn sm ghost\" sc-camel-on-click=\"{{gBack}}\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-left\"><\u002Fuse><\u002Fsvg>Juegos<\u002Fbutton><\u002Fsc-if><h2>{{gTitle}}<\u002Fh2><button class=\"btn sm ghost\" sc-camel-on-click=\"{{closeModal}}\" aria-label=\"Cerrar\"><svg class=\"ic s\" aria-hidden=\"true\"><use href=\"#i-close\"><\u002Fuse><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n      <div class=\"mb\">\n        <sc-if value=\"{{isHub}}\" hint-placeholder-val=\"{{true}}\">\n          <p>Juega con calma: aquí nadie compite ni pierde. Cada juego usa solo datos de la investigación.<\u002Fp>\n          <div class=\"grid2 games\"><sc-for list=\"{{gamesList}}\" as=\"x\" hint-placeholder-count=\"5\">\n            <button class=\"gcard\" style=\"background:{{x.bg}}\" sc-camel-on-click=\"{{x.click}}\"><svg sc-camel-view-box=\"0 0 64 64\" width=\"56\" height=\"56\" aria-hidden=\"true\" class=\"gl\"><use href=\"{{x.ref}}\"><\u002Fuse><\u002Fsvg><h3>{{x.n}}<\u002Fh3><span>{{x.d}}<\u002Fspan><span class=\"small\">{{x.best}}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{isG1}}\" hint-placeholder-val=\"{{false}}\">\n          <sc-if value=\"{{g1Play}}\" hint-placeholder-val=\"{{true}}\">\n            <div class=\"row\"><span class=\"pill info\">{{g1lv}}<\u002Fspan><span class=\"pill ok\">Pregunta {{g1i}} de {{g1n}}<\u002Fspan><span class=\"pill verif\">Puntos: {{g1score}}<\u002Fspan><\u002Fdiv>\n            <div class=\"row\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" width=\"84\" height=\"84\" aria-hidden=\"true\"><use href=\"{{g1ref}}\"><\u002Fuse><\u002Fsvg><p class=\"big-q\">¿En qué región se cultiva {{g1q}}?<\u002Fp><\u002Fdiv>\n            <div class=\"grid2\"><sc-for list=\"{{g1opts}}\" as=\"o\" hint-placeholder-count=\"6\"><button class=\"{{o.cls}}\" disabled=\"{{o.dis}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <sc-if value=\"{{g1ans}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fb neu\" role=\"status\"><span>{{g1fb}}<\u002Fspan><\u002Fdiv><button class=\"btn\" sc-camel-on-click=\"{{g1next}}\">{{g1nextTxt}}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fsc-if>\n          <sc-if value=\"{{g1done}}\" hint-placeholder-val=\"{{false}}\"><h3>¡Terminaste! {{g1score}} puntos<\u002Fh3><div class=\"row\"><sc-for list=\"{{g1stars}}\" as=\"s\" hint-placeholder-count=\"3\"><svg class=\"ic l\" aria-hidden=\"true\" style=\"opacity:{{s.op}}\"><use href=\"#i-star\"><\u002Fuse><\u002Fsvg><\u002Fsc-for><\u002Fdiv><div class=\"row\"><button class=\"btn\" sc-camel-on-click=\"{{g1again}}\">Jugar otra vez<\u002Fbutton><button class=\"btn ghost\" sc-camel-on-click=\"{{gBack}}\">Otros juegos<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{isG2}}\" hint-placeholder-val=\"{{false}}\">\n          <p>Elige una región, un cultivo y las condiciones. Evaluamos solo lo que la investigación documenta; el resto dice «dato por investigar».<\u002Fp>\n          <h3>1. Región<\u002Fh3><div class=\"grid3\"><sc-for list=\"{{g2regs}}\" as=\"o\" hint-placeholder-count=\"6\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <h3>2. Cultivo<\u002Fh3><div class=\"grid3 scrollbox\"><sc-for list=\"{{g2crops}}\" as=\"c\" hint-placeholder-count=\"6\"><button class=\"{{c.cls}}\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{c.click}}\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\"><use href=\"{{c.ref}}\"><\u002Fuse><\u002Fsvg>{{c.name}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <h3>3. Altura<\u002Fh3><div class=\"grid2\"><sc-for list=\"{{g2alt}}\" as=\"o\" hint-placeholder-count=\"5\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <h3>4. Temperatura<\u002Fh3><div class=\"grid2\"><sc-for list=\"{{g2temp}}\" as=\"o\" hint-placeholder-count=\"4\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <h3>5. Agua<\u002Fh3><div class=\"grid2\"><sc-for list=\"{{g2agua}}\" as=\"o\" hint-placeholder-count=\"4\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <h3>6. Luz<\u002Fh3><div class=\"grid2\"><sc-for list=\"{{g2luz}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <h3>7. Suelo<\u002Fh3><div class=\"grid2\"><sc-for list=\"{{g2suelo}}\" as=\"o\" hint-placeholder-count=\"5\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <button class=\"btn\" disabled=\"{{g2notReady}}\" sc-camel-on-click=\"{{g2go}}\">¡Sembrar!<\u002Fbutton>\n          <sc-if value=\"{{g2hasRes}}\" hint-placeholder-val=\"{{false}}\">\n            <div class=\"card\"><div class=\"row\"><svg class=\"gl\" sc-camel-view-box=\"0 0 64 64\" width=\"56\" height=\"56\" aria-hidden=\"true\"><use href=\"{{g2cref}}\"><\u002Fuse><\u002Fsvg><h3>{{g2c}}<\u002Fh3><\u002Fdiv>\n              <p><b>{{g2msg}}<\u002Fb><\u002Fp>\n              <div class=\"row\"><sc-for list=\"{{g2stars}}\" as=\"s\" hint-placeholder-count=\"3\"><svg class=\"ic l\" aria-hidden=\"true\" style=\"opacity:{{s.op}}\"><use href=\"#i-star\"><\u002Fuse><\u002Fsvg><\u002Fsc-for><\u002Fdiv>\n              <sc-for list=\"{{g2rows}}\" as=\"r\" hint-placeholder-count=\"5\"><div class=\"{{r.cls}}\"><svg class=\"ic\" aria-hidden=\"true\"><use href=\"{{r.ic}}\"><\u002Fuse><\u002Fsvg><span><b>{{r.dim}}: {{r.choice}}.<\u002Fb> {{r.why}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n              <sc-if value=\"{{g2lowData}}\" hint-placeholder-val=\"{{false}}\"><div class=\"nodata\">De este cultivo la investigación documenta pocas condiciones; por eso el resultado es parcial.<\u002Fdiv><\u002Fsc-if>\n              <button class=\"btn sm ghost\" sc-camel-on-click=\"{{g2again}}\">Probar otro cultivo<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{isG3}}\" hint-placeholder-val=\"{{false}}\">\n          <sc-if value=\"{{g3Play}}\" hint-placeholder-val=\"{{true}}\">\n            <div class=\"row\"><span class=\"pill ok\">Ronda {{g3r}} de {{g3n}}<\u002Fspan><span class=\"pill verif\">Puntos: {{g3score}}<\u002Fspan><\u002Fdiv>\n            <p class=\"big-q\">{{g3t}}<\u002Fp>\n            <sc-if value=\"{{g3verif}}\" hint-placeholder-val=\"{{false}}\"><span class=\"pill verif\">Rangos por verificar<\u002Fspan><\u002Fsc-if>\n            <div class=\"col\"><sc-for list=\"{{g3slots}}\" as=\"s\" hint-placeholder-count=\"4\"><button class=\"{{s.cls}}\" sc-camel-on-click=\"{{s.click}}\"><span class=\"n\">{{s.n}}<\u002Fspan><span>{{s.t}}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <p class=\"small\">Toca las tarjetas en orden. Toca un casillero para quitarla.<\u002Fp>\n            <div class=\"row\"><sc-for list=\"{{g3tiles}}\" as=\"t\" hint-placeholder-count=\"4\"><button class=\"tile\" disabled=\"{{t.dis}}\" sc-camel-on-click=\"{{t.click}}\">{{t.t}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <sc-if value=\"{{g3ready}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn\" sc-camel-on-click=\"{{g3go}}\">Comprobar<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{g3checked}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fb neu\" role=\"status\"><span><b>{{g3last}} de {{g3total}} en su lugar.<\u002Fb> Orden correcto: <sc-for list=\"{{g3ans}}\" as=\"a\" hint-placeholder-count=\"3\"><span>{{a.n}}. {{a.t}}; <\u002Fspan><\u002Fsc-for><br>Fuente: {{g3src}}<\u002Fspan><\u002Fdiv><button class=\"btn\" sc-camel-on-click=\"{{g3next}}\">{{g3nextTxt}}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fsc-if>\n          <sc-if value=\"{{g3done}}\" hint-placeholder-val=\"{{false}}\"><h3>¡Terminaste! {{g3score}} puntos<\u002Fh3><div class=\"row\"><sc-for list=\"{{g3stars}}\" as=\"s\" hint-placeholder-count=\"3\"><svg class=\"ic l\" aria-hidden=\"true\" style=\"opacity:{{s.op}}\"><use href=\"#i-star\"><\u002Fuse><\u002Fsvg><\u002Fsc-for><\u002Fdiv><div class=\"row\"><button class=\"btn\" sc-camel-on-click=\"{{g3again}}\">Jugar otra vez<\u002Fbutton><button class=\"btn ghost\" sc-camel-on-click=\"{{gBack}}\">Otros juegos<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{isG4}}\" hint-placeholder-val=\"{{false}}\">\n          <sc-if value=\"{{g4Play}}\" hint-placeholder-val=\"{{true}}\">\n            <div class=\"row\"><span class=\"pill ok\">Situación {{g4i}} de {{g4n}}<\u002Fspan><span class=\"pill verif\">Puntos: {{g4score}}<\u002Fspan><\u002Fdiv>\n            <h3>{{g4t}}<\u002Fh3><p>{{g4s}}<\u002Fp><p><b>Elige 2 medidas.<\u002Fb> Te faltan {{g4left}}.<\u002Fp>\n            <div class=\"col\"><sc-for list=\"{{g4opts}}\" as=\"o\" hint-placeholder-count=\"5\">\n              <div class=\"col\"><button class=\"{{o.cls}}\" aria-pressed=\"{{o.on}}\" sc-camel-on-click=\"{{o.click}}\">{{o.t}}<\u002Fbutton>\n                <sc-if value=\"{{g4checked}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fb neu\"><span><span class=\"{{o.lblCls}}\">{{o.label}}<\u002Fspan> <span class=\"{{o.tagCls}}\">{{o.tag}}<\u002Fspan><br>{{o.why}} <i>{{o.when}}<\u002Fi><\u002Fspan><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n            <\u002Fsc-for><\u002Fdiv>\n            <sc-if value=\"{{g4ready}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn\" sc-camel-on-click=\"{{g4go}}\">Comprobar<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{g4checked}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn\" sc-camel-on-click=\"{{g4next}}\">{{g4nextTxt}}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fsc-if>\n          <sc-if value=\"{{g4done}}\" hint-placeholder-val=\"{{false}}\"><h3>¡Detective del clima! {{g4score}} puntos<\u002Fh3><p class=\"small\">Las medidas marcadas «principio general» son ideas comunes que conviene validar con AGROSAVIA o asistencia técnica local.<\u002Fp><div cla e 35 °C pueden darse cosechas prematuras y menor rendimiento.\",\"fuente\":\"sancluster\"}},\"personajes\":[{\"id\":\"mango-tomas\",\"nombre\":\"Mango Tomás\",\"cultivo\":\"mango\",\"region\":\"Andina\",\"personalidad\":\"Soleado y paciente: espera el momento justo para florecer.\",\"habilidad\":\"Detector de épocas secas: te enseña cómo el clima cambia las flores y los frutos.\",\"presentacion\":\"¡Hola! Soy Mango Tomás. En el Alto Magdalena hay dos épocas secas y dos lluviosas, ¡y yo las siento todas!\",\"celebra\":\"baile\"},{\"id\":\"tomate-tola\",\"nombre\":\"Tomate Tola\",\"cultivo\":\"tomate\",\"region\":null,\"personalidad\":\"Veloz y divertida: sabe lo rápido que cambian los precios.\",\"habilidad\":\"Calculadora de rendimientos: compara toneladas por hectárea.\",\"presentacion\":\"Soy Tomate Tola y rindo 54,2 toneladas por hectárea. ¡Pero mi precio sube y baja como montaña rusa!\",\"celebra\":\"salto\"},{\"id\":\"mora-mia\",\"nombre\":\"Mora Mía\",\"cultivo\":\"mora\",\"region\":null,\"personalidad\":\"Cuidadosa y presumida: necesita un tutor que la sostenga.\",\"habilidad\":\"Cazadora de calidad: explica por qué el precio sube cuando falta fruta de primera.\",\"presentacion\":\"Me llamo Mora Mía. Cuando falta fruta de primera calidad, ¡mi precio se pone por las nubes!\",\"celebra\":\"giro\"},{\"id\":\"papa-pacha\",\"nombre\":\"Papa Pacha\",\"cultivo\":\"papa\",\"region\":\"Andina\",\"personalidad\":\"Tranquila y fuerte: vive en las alturas y no le asusta el frío.\",\"habilidad\":\"Guía de las alturas: lee altitudes y temperaturas frescas.\",\"presentacion\":\"Soy Papa Pacha. Vengo de los Andes del sur y hoy crezco en los altiplanos de Colombia.\",\"celebra\":\"abrazo\"},{\"id\":\"boro-beto\",\"nombre\":\"Borojó Beto\",\"cultivo\":\"borojo\",\"region\":\"Pacifica\",\"personalidad\":\"Valiente y fresco: no le teme a la lluvia ni a la sombra del bosque.\",\"habilidad\":\"Guardián del agua: mide cuánta lluvia necesita un cultivo.\",\"presentacion\":\"¡Soy Bor },{\"nombre\":\"Toronja\",\"categoria\":\"fruta\"},{\"nombre\":\"Lechuga\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Repollo\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Brócoli\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Coliflor\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Espinaca\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Acelga\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Cilantro\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Apio\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Pepino\",\"categoria\":\"hortaliza\",\"precio\":\"Pepino cohombro en Cali: $2.682/kg, +56,48 % frente a agosto de 2026 (mayorista, SIPSA).\"},{\"nombre\":\"Pimentón\",\"categoria\":\"hortaliza\",\"precio\":\"Pimentón en Medellín: $3.011/kg, +99,14 % frente a agosto de 2026 (mayorista, SIPSA).\"},{\"nombre\":\"Ajíes\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Berenjena\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Calabacín\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Ahuyama\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Habichuela\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Arveja\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Remolacha\",\"categoria\":\"hortaliza\",\"precio\":\"Remolacha en Cúcuta: –54,11 % frente a septiembre de 2025 (mayorista, SIPSA).\"},{\"nombre\":\"Rábano\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Ajo\",\"categoria\":\"hortaliza\"},{\"nombre\":\"Ñame\",\"categoria\":\"raiz\"},{\"nombre\":\"Yacón\",\"categoria\":\"raiz\"},{\"nombre\":\"Malanga / bore\",\"categoria\":\"raiz\"},{\"nombre\":\"Batata\",\"categoria\":\"raiz\"},{\"nombre\":\"Soya y otras de rotación\",\"categoria\":\"leguminosa\"}]}};\nconst W = 1000, H = 1090;\nconst REG = ['Caribe', 'Andina', 'Pacifica', 'Orinoquia', 'Amazonia', 'Insular'];\nconst REGN = { Caribe: 'Caribe', Andina: 'Andina', Pacifica: 'Pacífica', Orinoquia: 'Orinoquía', Amazonia: 'Amazonía', Insular: 'Insular' };\nconst CATN = { fruta: 'Fruta', hortaliza: 'Hortaliza', raiz: 'Raíz', tuberculo: 'Tubérculo', cereal: 'Cereal', leguminosa: 'Leguminosa' };\nconst CATG = [\n  { id: 'fruta', n: 'Frutas', m: ['fruta'] },\n  { id: 'hortaliza', n: 'Hortalizas', m: ['hortaliza'] },\n  { id: 'raiz', n: 'Raíces y tubérculos', m: ['raiz', 'tuberculo'] },\n  { id: 'cereal', n: 'Cereales y leguminosas', m: ['cereal', 'leguminosa'] }\n];\nconst ORIG = { america: 'América', asia: 'Asia', 'asia-europa': 'Asia y Europa', hibrido: 'Híbrido (América + Europa)' };\nconst MONTHN = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];\nconst MONTHS = ['E', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];\nconst DEPT = {}; DATA.geo.depts.forEach(d => { DEPT[d.id] = d; });\nconst CROP = {}; DATA.crops.forEach(c => { CROP[c.id] = c; });\nconst CHAR = {}; DATA.personajes.forEach(p => { CHAR[p.id] = p; });\nconst REGI = DATA.regiones;\nconst FUENTE = DATA.fuentes;\nconst STORE_KEY = 'fruti-nuestro-v1';\n\nfunction norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }\nfunction fmt(n, d) { if (n == null) return ''; return Number(n).toLocaleString('es-CO', { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: d == null ? 0 : d }); }\nfunction pct(n) { return (n > 0 ? '+' : n < 0 ? '–' : '') + fmt(Math.abs(n), 2) + ' %'; }\nfunction shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }\nfunction pick(a, n) { return shuffle(a).slice(0, n); }\nfunction catGroup(c) { return CATG.find(g => g.m.indexOf(c.categoria) >= 0).id; }\nfunction evLevel(c) { return /^Alta/.test(c.ev) ? 'Alta' : /^Media/.test(c.ev) ? 'Media' : 'Baja'; }\n\n/* regiones y departamentos documentados de un cultivo */\nfunction placesOf(c, withDeduced) {\n  const out = [];\n  (c.lugares || []).forEach(l => out.push(l));\n  if (withDeduced && c.deducido) c.deducido.forEach(r => out.push({ n: 'region', id: r, conf: 'deducida', nota: 'Deducida solo por su rango de altitud (' + c.altitud.min + '–' + c.altitud.max + ' m). No confirmada: dato por investigar.', f: [], deducida: true }));\n  return out;\n}\nfunction regionsOf(c, withDeduced) {\n  const s = {};\n  placesOf(c, withDeduced).forEach(l => { s[l.n === 'dpto' ? DEPT[l.id].region : l.id] = true; });\n  return Object.keys(s);\n}\nfunction deptsOf(c) { return (c.lugares || []).filter(l => l.n === 'dpto').map(l => l.id); }\n\n/* nivel de confianza por bloque: ok | verif | nd */\nfunction conf(c, k) {\n  const baja = evLevel(c) === 'Baja';\n  const lv = (o) => { if (!o) return 'nd'; if (o.est === 'verif' || baja) return 'verif'; return 'ok'; };\n  if (k === 'altitud') return lv(c.altitud);\n  if (k === 'temp') return c.temp ? lv(c.temp) : 'nd';\n  if (k === 'agua') return c.agua ? lv(c.agua) : 'nd';\n  if (k === 'suelo') return c.suelo ? lv(c.suelo) : 'nd';\n  if (k === 'luz') return c.luz ? lv(c.luz) : 'nd';\n  if (k === 'ciclo') return c.ciclo ? lv(c.ciclo) : 'nd';\n  if (k === 'lugares') {\n    const L = c.lugares || [];\n    if (!L.length) return c.deducido ? 'verif' : 'nd';\n    return L.every(l => l.conf === 'baja') ? 'verif' : 'ok';\n  }\n  if (k === 'prod') return c.prod && c.prod.y2024 ? 'ok' : 'nd';\n  if (k === 'expo') return c.expo ? 'ok' : 'nd';\n  if (k === 'precio') return (c.precios || []).some(p => p.copkg != null || p.anual != null) ? 'ok' : 'nd';\n  if (k === 'origen') return 'ok';\n  if (k === 'cal') return c.cal && c.cal.clima ? 'ok' : 'nd';\n  return 'nd';\n}\nconst CONF_T = { ok: 'Respaldado por fuente', verif: 'Referencia por verificar', nd: 'Dato no disponible' };\n\nfunction emptyFilters() { return { q: '', cat: '', region: '', dept: '', temp: '', alt: '', agua: '', mes: '', origen: '', sens: '', datos: '', deducidas: false }; }\nfunction activeFilterCount(f) { let n = 0; ['q', 'cat', 'region', 'dept', 'temp', 'alt', 'agua', 'mes', 'origen', 'sens', 'datos'].forEach(k => { if (f[k] !== '' && f[k] != null) n++; }); return n; }\nfunction hasDataFilter(f) { return ['region', 'dept', 'temp', 'alt', 'agua', 'mes', 'origen', 'sens'].some(k => f[k] !== ''); }\nfunction matches(c, f) {\n  if (f.q) { const q = norm(f.q); if (norm(c.nombre + ' ' + c.cientifico + ' ' + c.familia + ' ' + c.id).indexOf(q) < 0) return false; }\n  if (f.cat && catGroup(c) !== f.cat) return false;\n  if (f.region) {\n    const rs = regionsOf(c, f.deducidas);\n    if (f.region === 'sin') { if (rs.length) return false; } else if (rs.indexOf(f.region) < 0) return false;\n  }\n  if (f.dept && deptsOf(c).indexOf(f.dept) < 0) return false;\n  if (f.temp !== '') {\n    const t = Number(f.temp), T = c.temp;\n    if (!T) return false;\n    if (T.min != null && T.max != null) { if (t < T.min || t > T.max) return false; }\n    else if (T.opt != null) { if (Math.abs(t - T.opt) > 2) return false; } else return false;\n  }\n  if (f.alt !== '') { const a = Number(f.alt); if (a < c.altitud.min || a > c.altitud.max) return false; }\n  if (f.agua) {\n    const A = c.agua;\n    if (f.agua === 'sin') { if (A) return false; }\n    else {\n      if (!A) return false;\n      if (f.agua === 'mucha' && !(A.mm >= 1500)) return false;\n      if (f.agua === 'media' && !(A.mm >= 1000 && A.mm < 1500)) return false;\n    }\n  }\n  if (f.mes) { const m = c.cal && c.cal.cosecha; if (!m || m.indexOf(Number(f.mes)) < 0) return false; }\n  if (f.origen && c.origen.grupo !== f.origen) return false;\n  if (f.sens === 'doc' && !(c.sens && c.sens.nivel === 'documentada')) return false;\n  if (f.sens === 'sin' && c.sens) return false;\n  if (f.datos === 'alta' && evLevel(c) !== 'Alta') return false;\n  if (f.datos === 'media' && evLevel(c) !== 'Media') return false;\n  if (f.datos === 'baja' && evLevel(c) !== 'Baja') return false;\n  if (f.datos === 'pendiente') return false;\n  return true;\n}\nfunction pendMatches(p, f) {\n  if (hasDataFilter(f)) return false;\n  if (f.datos && f.datos !== 'pendiente') return false;\n  if (f.q && norm(p.nombre).indexOf(norm(f.q)) < 0) return false;\n  if (f.cat) { const g = CATG.find(x => x.id === f.cat); if (g.m.indexOf(p.categoria) < 0) return false; }\n  return true;\n}\nfunction emptyProg() { return { found: {}, stars: 0, badges: {}, regions: {}, quiz: {}, played: {}, best: {}, waterOk: 0, simTouch: 0, tourDone: false, pendNote: false, answers: 0 }; }\nfunction loadProg() {\n  const base = emptyProg();\n  try { const s = window.localStorage.getItem(STORE_KEY); if (s) return Object.assign(base, JSON.parse(s)); } catch (e) { /* sin almacenamiento */ }\n  return base;\n}\nconst BADGES = [\n  { id: 'explorador', n: 'Explorador', d: 'Descubre tu primer cultivo.', ic: 'i-compass', test: p => Object.keys(p.found).length >= 1 },\n  { id: 'guardian', n: 'Guardián del agua', d: 'Acierta 3 veces con el agua en «Planta tu cultivo».', ic: 'i-drop', test: p => p.waterOk >= 3 },\n  { id: 'detective', n: 'Detective del clima', d: 'Completa «Detectives del clima» o prueba el simulador 6 veces.', ic: 'i-cloud', test: p => !!p.played.g4 || p.simTouch >= 6 },\n  { id: 'experto', n: 'Experto en cultivos', d: 'Descubre 14 cultivos (la mitad).', ic: 'i-leaf', test: p => Object.keys(p.found).length >= 14 },\n  { id: 'embajador', n: 'Embajador de la biodiversidad', d: 'Descubre los 28 cultivos y termina la aventura guiada.', ic: 'i-star', test: p => Object.keys(p.found).length >= DATA.crops.length && p.tourDone }\n];\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.ptrs = new Map(); this.moved = 0; this.last = null; this.mapEl = null; this.pinch = null;\n    this.setMapRef = (el) => {\n      this.mapEl = el;\n      if (this._ro) { try { this._ro.disconnect(); } catch (e) { /* */ } this._ro = null; }\n      if (el && typeof ResizeObserver !== 'undefined') {\n        this._ro = new ResizeObserver(() => { const r = el.getBoundingClientRect(); if (Math.abs(r.width - (this.state.mw || 0)) > 2 || Math.abs(r.height - (this.state.mh || 0)) > 2) this.setState({ mw: r.width, mh: r.height }); });\n        this._ro.observe(el);\n      }\n    };\n    this.storeOk = true;\n    const prog = loadProg();\n    try { window.localStorage.setItem(STORE_KEY + '-t', '1'); window.localStorage.removeItem(STORE_KEY + '-t'); } catch (e) { this.storeOk = false; }\n    this.state = {\n      view: 'inicio', region: null, dept: null, cropId: null, tab: 'id', rtab: 'resumen', back: null,\n      k: 1, tx: 0, ty: 0, anim: '', drag: false, hover: null,\n      f: emptyFilters(), showF: false, layer: false, deducidas: false,\n      sim: { site: 'mango', dT: 0, dP: 0, sequia: 0, lluvia: 0, dist: 0, tBase: 24, pBase: 1300, periodo: 2, dpto: 'antioquia' },\n      modal: null, g: {}, prog, sheetMin: false, tour: { on: false, step: 0, quiz: null, seen: [], done: false }, toast: null,\n      mw: 0, mh: 0, trayOpen: false, growth: 0, play: false, resetAsk: false, helpOpen: true, quizA: {}\n    };\n  }\n  componentDidMount() { this._timers = []; }\n  componentWillUnmount() { (this._timers || []).forEach(clearTimeout); clearInterval(this._grow); }\n  later(fn, ms) { const t = setTimeout(fn, ms); (this._timers = this._timers || []).push(t); return t; }\n\n  /* ---------- progreso y recompensas ---------- */\n  saveProg(p) {\n    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) { this.storeOk = false; }\n  }\n  updProg(fn, toast) {\n    const p = JSON.parse(JSON.stringify(this.state.prog));\n    fn(p);\n    const gained = [];\n    BADGES.forEach(b => { if (!p.badges[b.id] && b.test(p)) { p.badges[b.id] = Date.now(); gained.push(b); } });\n    CATG.forEach(g => {\n      const id = 'cat-' + g.id;\n      const all = DATA.crops.filter(c => g.m.indexOf(c.categoria) >= 0);\n      if (!p.badges[id] && all.every(c => p.found[c.id])) { p.badges[id] = Date.now(); gained.push({ n: g.n + ' completas', ic: 'i-album' }); }\n    });\n    this.saveProg(p);\n    const st = { prog: p };\n    if (gained.length) st.toast = { t: '¡Nueva insignia: ' +
